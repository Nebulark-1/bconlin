<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ben Conlin - Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/resume.css" />
    <link rel="stylesheet" href="/src/styles/fab.css" />
  </head>
  <body class="page-resume">
    <header class="site-head">
      <a class="site-head__brand" href="./">
        <span class="site-head__mark">BC</span>
        <span class="site-head__name">Ben Conlin</span>
      </a>
      <nav class="site-head__nav" aria-label="Site">
        <a href="./">Home</a>
        <a href="career.html">Career</a>
        <a href="resume.html" aria-current="page">Résumé</a>
        <span class="is-soon" title="Coming soon">Projects</span>
        <span class="is-soon" title="Coming soon">About</span>
      </nav>
      <div class="site-head__cta">
        <a class="site-head__resume" href="resume/Ben-Conlin-Resume.pdf" download>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" /></svg>
          Résumé PDF
        </a>
      </div>
    </header>

    <div class="resume-page">
      <aside class="tailor" aria-label="Tailor this résumé">
        <p class="tailor__kicker">Résumé</p>
        <h1 class="tailor__title">Tailor it to your role</h1>

        <p class="tailor__label">Focus</p>
        <div class="tailor__lenses" role="group" aria-label="Focus"></div>

        <p class="tailor__label">Length</p>
        <div class="tailor__seg" role="group" aria-label="Length">
          <button type="button" data-length="page" aria-pressed="true">One page</button>
          <button type="button" data-length="full" aria-pressed="false">Everything</button>
        </div>

        <button type="button" class="tailor__switch" role="switch" aria-checked="true" data-healthcare>
          <span class="tailor__knob" aria-hidden="true"></span>Include my current healthcare role
        </button>

        <p class="tailor__count"></p>

        <div class="tailor__actions">
          <button type="button" class="tailor__btn tailor__btn--primary" data-print>Save this version as PDF</button>
          <a class="tailor__btn" href="resume/Ben-Conlin-Resume.pdf" download>Download the standard PDF</a>
        </div>
      </aside>

      <article class="paper" aria-label="Résumé"></article>
    </div>

    <script type="module" src="/src/resume/main.js"></script>
  </body>
</html>
